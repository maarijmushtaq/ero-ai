name: nexora ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}


jobs:

  # =========================================================
  # BACKEND
  # =========================================================

  deploy-backend:

    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5


      # -------------------------------------------------------
      # AWS Configuration
      # -------------------------------------------------------

      - name: AWS configure
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------------------------------------
      # Login to ECR
      # -------------------------------------------------------

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # =======================================================
      # GATEWAY
      # =======================================================

      - name: Build Gateway
        run: |
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway \
            backend


      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest


      - name: Push Gateway
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest


      # =======================================================
      # AUTH SERVICE
      # =======================================================

      - name: Build Auth Service
        run: |
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service \
            backend


      - name: Tag Auth Service
        run: |
          docker tag auth-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest


      - name: Push Auth Service
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest


      # =======================================================
      # CHAT SERVICE
      # =======================================================

      - name: Build Chat Service
        run: |
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service \
            backend


      - name: Tag Chat Service
        run: |
          docker tag chat-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest


      - name: Push Chat Service
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest


      # =======================================================
      # AGENT SERVICE
      # =======================================================

      - name: Build Agent Service
        run: |
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service \
            backend


      - name: Tag Agent Service
        run: |
          docker tag agent-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest


      - name: Push Agent Service
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest


      # =======================================================
      # ECS DEPLOYMENT
      # =======================================================

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.GATEWAY_SERVICE }} \
            --force-new-deployment


      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AUTH_SERVICE }} \
            --force-new-deployment


      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.CHAT_SERVICE }} \
            --force-new-deployment


      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.AGENT_SERVICE }} \
            --force-new-deployment


  # =========================================================
  # FRONTEND
  # =========================================================

  deploy-frontend:

    needs: deploy-backend

    runs-on: ubuntu-24.04

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5


      # -------------------------------------------------------
      # Setup Node.js
      # -------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      # -------------------------------------------------------
      # Build Frontend
      # -------------------------------------------------------

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL }}


      # -------------------------------------------------------
      # AWS Configuration
      # -------------------------------------------------------

      - name: AWS configure
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------------------------------------
      # Upload Frontend to S3
      # -------------------------------------------------------

      - name: Upload Frontend to S3
        run: |
          aws s3 sync \
            frontend/dist \
            s3://${{ secrets.S3_BUCKET }} \
            --delete


      # -------------------------------------------------------
      # CloudFront Invalidation
      # -------------------------------------------------------

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION }} \
            --paths "/*"