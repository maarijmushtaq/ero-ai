name: nexora ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}


jobs:

  deploy-backend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: AWS configure
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2



      # Gateway

      - name: Build Gateway
        run: |
          docker build \
          -f backend/gateway/Dockerfile \
          -t gateway .


      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest


      - name: Push Gateway
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest



      # Auth Service

      - name: Build Auth Service
        run: |
          docker build \
          -f backend/services/auth/Dockerfile \
          -t auth-service .


      - name: Tag Auth Service
        run: |
          docker tag auth-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest


      - name: Push Auth Service
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest



      # Chat Service

      - name: Build Chat Service
        run: |
          docker build \
          -f backend/services/chat/Dockerfile \
          -t chat-service .


      - name: Tag Chat Service
        run: |
          docker tag chat-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest


      - name: Push Chat Service
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest



      # Agent Service

      - name: Build Agent Service
        run: |
          docker build \
          -f backend/services/agent/Dockerfile \
          -t agent-service .


      - name: Tag Agent Service
        run: |
          docker tag agent-service:latest \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest


      - name: Push Agent Service
        run: |
          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest




      # ECS Deployment

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.GATEWAY_SERVICE }} \
          --force-new-deployment


      - name: Deploy Auth
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.AUTH_SERVICE }} \
          --force-new-deployment


      - name: Deploy Chat
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.CHAT_SERVICE }} \
          --force-new-deployment


      - name: Deploy Agent
        run: |
          aws ecs update-service \
          --cluster ${{ secrets.ECS_CLUSTER }} \
          --service ${{ secrets.AGENT_SERVICE }} \
          --force-new-deployment





  deploy-frontend:

    needs: deploy-backend

    runs-on: ubuntu-latest

    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build



      - name: AWS configure
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}



      - name: Upload Frontend to S3
        run: |
          aws s3 sync \
          frontend/dist \
          s3://${{ secrets.S3_BUCKET }} \
          --delete



      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION }} \
          --paths "/*"